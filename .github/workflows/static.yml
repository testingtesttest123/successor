name: static

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  current-integration:
    runs-on: ubuntu-latest
    env:
      ERL_FLAGS: "+S 4:4"
      GIT_LFS_SKIP_SMUDGE: "1" # Go's upstream example-image LFS object is unavailable.
    steps:
      - uses: actions/checkout@v7
        with:
          path: successor
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.19.0"
          rebar3-version: "3.25.1"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache-dependency-path: |
            albedo/cli/go.sum
            albedo/cli/tools/apigen/go.sum
          cache: false # The host is fetched after tool setup.
      - name: Install pinned Python analyzers
        run: python -m pip install ruff==0.16.10 ty==0.0.85
      - name: Prepare current host and locked glinter
        working-directory: successor
        run: python scripts/prepare_static.py
      - name: Check actual current integration
        working-directory: successor
        run: python scripts/static_checks.py
