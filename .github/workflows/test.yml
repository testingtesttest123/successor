name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ERL_FLAGS: "+S 4:4"
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.19.0"
          rebar3-version: "3"
          # elixir-version: "1"
      - name: Install coding-helper search dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: gleam deps download
      - run: gleam test
      - name: Python kernel and transport tests (stdlib only)
        run: python3 -m unittest discover -s test/python -v
      - run: gleam format --check src test
